<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildWay Travel - Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(0, 128, 128, 0.1) 100%);
            padding: 40px 20px;
        }
        .auth-card {
            background-color: var(--bg-color);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            padding: 2.5rem;
            position: relative;
        }
        .social-btn {
            border: 1px solid #ddd;
            background-color: transparent;
            color: var(--text-color);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }
        .social-btn:hover {
            background-color: rgba(0, 128, 128, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        [data-theme="dark"] .social-btn {
            border-color: #444;
            color: #fff;
        }
        [data-theme="dark"] .auth-card {
            background-color: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        [data-theme="dark"] .form-control {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        [data-theme="dark"] .form-control::placeholder {
            color: #888;
        }
        [data-theme="dark"] .form-control:focus {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-color);
            color: #fff;
        }
        [data-theme="dark"] .input-group-text {
            border-color: rgba(255, 255, 255, 0.1);
        }
        [data-theme="dark"] .text-muted {
            color: #adb5bd !important;
        }
        .cursor-pointer { cursor: pointer; }
    </style>
<link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
</head>
<body style="background: url('https://images.unsplash.com/photo-1506012787146-f92b2d7d6d96?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed; background-size: 100% 100%;">

    <div class="auth-container">
        <div class="auth-card animate-up">

            <div class="text-center mb-4 mt-2">
                <a class="navbar-brand d-inline-flex align-items-center justify-content-center gap-2 mb-3" href="index.html" style="padding: 0;">
                      <img src="assets/images/logo.svg" alt="WildWay Logo" width="30" height="30">
                      WildWay Travel
                  </a>
                <h5 class="fw-bold">Welcome Back</h5>
                <p class="text-muted small mb-0">Login to your account</p>
            </div>
            
            <form>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email address</label>
                    <input type="email" class="form-control py-2" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control py-2 border-end-0" id="passwordInput" placeholder="Enter your password" required>
                        <span class="input-group-text bg-transparent border-start-0 cursor-pointer" onclick="togglePassword('passwordInput', this)">
                            <i class="bi bi-eye-slash text-muted"></i>
                        </span>
                    </div>
                </div>
                <div class="mb-4 d-flex justify-content-between align-items-center">
                    <div class="form-check mb-0">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="text-primary text-decoration-none small fw-normal">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-4">Login</button>
            </form>
            
            <div class="position-relative text-center mb-4">
                <hr class="text-muted">
                <span class="position-absolute top-50 start-50 translate-middle px-3 small" style="background-color: var(--bg-color); color: var(--text-color);">Or login with</span>
            </div>
            
            <div class="d-flex gap-3 mb-4">
                <button class="social-btn w-100"><i class="bi bi-google text-danger"></i> Google</button>
                <button class="social-btn w-100"><i class="bi bi-facebook text-primary"></i> Facebook</button>
            </div>
            
            <div class="text-center mt-auto">
                <p class="text-muted mb-0 small">Don't have an account? <a href="signup.html" class="text-primary fw-bold text-decoration-none">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        function togglePassword(inputId, iconSpan) {
            const input = document.getElementById(inputId);
            const icon = iconSpan.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            }
        }
    </script>
</body>
</html>
